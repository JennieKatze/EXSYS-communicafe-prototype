        <button name="button2" onclick="window.location.href='staff'"><i class="fa fa-users sidebar-icon"></i></button>
        <button name="button2" onclick="window.location.href='learningD'"><i class="fa fa-book sidebar-icon"></i></button>
        <button name="button2" onclick="window.location.href='settings'"><i class="fa fa-gear sidebar-icon"></i></button>
    </aside>

<main class="translator-box">
    <div class="input-column">

        <div class="language-selectors">
            <select id="sourceLang" name="source-language">
                <option value="da" selected>Danish</option>
                <option value="en">English</option>
                <option value="de">German</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="ar">Arabic</option>
                <option value="tr">Turkish</option>
                <option value="fa">Farsi (Persian)</option>
                
            </select>
            <span style="font-weight: bold; font-size: 1.5rem;">→</span>
            <select id="targetLang" name="target-language">
                <option value="en" selected>English</option>
                <option value="da">Danish</option>
                <option value="de">German</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="ar">Arabic</option>
                <option value="tr">Turkish</option>
                <option value="fa">Farsi (Persian)</option>
            </select>
        </div>

        <div class="box-row relative-container">
            <textarea id="inputText" name="text" required="required" placeholder="What do you want to translate?" autocomplete="off"></textarea>
            <button id="speak-input-btn" class="speaker-overlay" title="Læs det skrevne op"><i class="fa fa-volume-up"></i> </button>
        </div>

        <div class="button-row">
            <button name="button3">Translate</button>
        </div>
        <div class="box-row relative-container">
            <ul id="translation"></ul> 
            <button id="speak-output-btn" class="speaker-overlay" title="Læs det oversatte op"><i class="fa fa-volume-up"></i></button>
        </div>
    </div>  
</main>
</div>
<script type="text/javascript" src="translation.js"></script>

</body>
</html>
