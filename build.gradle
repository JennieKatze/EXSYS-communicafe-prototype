plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'com.sparkjava', name: 'spark-core', version: '2.9.3'
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.21'
    implementation group: 'org.json', name: 'json', version: '20220320'
    //implementation 'com.google.cloud:google-cloud-translate:2.43.0'
    //implementation platform('com.google.cloud:libraries-bom:26.1.4')
    //implementation 'com.google.cloud:google-cloud-iamcredentials'
}

application {
    mainClass = 'CommuniCafe'
}

task translation(type: JavaExec) {
    mainClass = 'CommuniCafe'
    //environment "GOOGLE_APPLICATION_CREDENTIALS", "${project.file("/src/main/resources/application_default_credentials.json")}"
    classpath = sourceSets.main.runtimeClasspath
}
